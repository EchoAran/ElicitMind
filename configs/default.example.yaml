# ==============================================================================
# Elicitation Core - Configuration Example
# 
# Copy this file to default.yaml to get started:
#   cp configs/default.example.yaml configs/default.yaml
#
# For detailed field definitions and tuning guide, see: docs/configuration.md
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Large Language Model Service Configuration (Model)
# ------------------------------------------------------------------------------
model:
  # LLM provider type (openai_compatible recommended)
  provider: "openai_compatible"

  # Full URL of the Chat Completions endpoint (compatible with OpenAI API format)
  # Examples:
  #   - OpenAI: "https://api.openai.com/v1/chat/completions"
  #   - DeepSeek: "https://api.deepseek.com/v1/chat/completions"
  #   - Alibaba DashScope: "https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions"
  #   - Local Ollama: "http://localhost:11434/v1/chat/completions"
  api_url: "https://api.openai.com/v1/chat/completions"

  # Environment variable name to retrieve the API key (recommended over hardcoding)
  api_key_env: "LLM_API_KEY"

  # Explicit API key (if empty, the system automatically checks api_key_env or OPENAI_API_KEY)
  api_key: ""

  # Target model identifier (e.g., gpt-4o, gpt-4o-mini, deepseek-chat, qwen-plus)
  model_name: "gpt-4o"

  # Sampling temperature (0.0 ~ 1.0). Lower temperature ensures deterministic JSON formatting and reasoning
  temperature: 0.2

  # HTTP request timeout in seconds
  timeout_seconds: 60.0

  # Maximum automatic retries upon network timeouts, disconnects, or rate limiting
  max_retries: 3


# ------------------------------------------------------------------------------
# 2. User Intent Control Configuration (Intent)
# ------------------------------------------------------------------------------
intent:
  # Direct execution confidence threshold for user control intentions (0.0 ~ 1.0).
  # When confidence >= threshold, the system immediately applies topic switching, refusal, or termination.
  confidence_threshold: 0.60

  # Confirmation threshold for ambiguous user control intentions (0.0 ~ 1.0).
  # When confidence falls between confirmation_threshold and confidence_threshold, the system triggers
  # the 'confirm_control' strategy to seek user clarification before taking action.
  confirmation_threshold: 0.40


# ------------------------------------------------------------------------------
# 3. Seven-Factor Dynamic Scheduler Weights Configuration (Scheduler)
# Note: The system automatically normalizes these weights (sum to 1.0) during loading.
# ------------------------------------------------------------------------------
scheduler:
  weights:
    # Prior weight derived from the initial framework and domain outline
    initial_prior: 0.15

    # Dependency readiness weight (higher score if all predecessor topics are completed)
    dependency_readiness: 0.20

    # Information gap weight (ratio of required slots that remain unfilled)
    unresolved_gap: 0.20

    # Conflict signal weight (prioritizes topics with contradictions to resolve issues early)
    conflict_signal: 0.15

    # Recent emergence weight (boosts newly discovered emergent topic directions)
    recent_emergence: 0.10

    # Conversational continuity weight (favors staying on the active topic until finished)
    continuity: 0.15

    # User relevance weight (relevance score when the interviewee mentions this topic)
    user_relevance: 0.05


# ------------------------------------------------------------------------------
# 4. Question Strategy Planning Configuration (Strategy)
# ------------------------------------------------------------------------------
strategy:
  # Maximum target slots to focus on within a single turn (1 recommended to prevent cognitive overload)
  max_target_slots: 1


# ------------------------------------------------------------------------------
# 5. Context Budget & Token Management Configuration (Context Budget)
# ------------------------------------------------------------------------------
context_budget:
  # Maximum overall token limit for question generation prompt (exceeding raises error without committing state)
  max_prompt_tokens: 3500

  # Maximum token budget for the recent conversation history block
  max_recent_turn_tokens: 800

  # Maximum token budget for the target evidence chain traceability block
  max_target_evidence_tokens: 800

  # Maximum token budget for the cross-topic known information block
  max_known_info_tokens: 600

  # Maximum token budget for the active topic slots block
  max_current_slots_tokens: 600

  # Maximum token budget for the global topic catalog block
  max_catalog_tokens: 400

  # Maximum number of conversation turn pairs (1 pair = 1 question + 1 answer) to retain in sliding window
  history_window_size: 6

  # Maximum number of slot definitions to include in the active topic prompt payload
  max_current_topic_slots: 15


# ------------------------------------------------------------------------------
# 6. Runtime System Configuration (Runtime)
# ------------------------------------------------------------------------------
runtime:
  # Stop execution without completing the project after this many interviewee turns
  max_turns: 50

  # Whether to use atomic file replacement when saving state.json (prevents corruption on sudden crash)
  atomic_state_write: true

  # Whether to record raw unparsed LLM text responses into llm_calls.jsonl for auditing
  log_raw_llm_response: true

  # Whether to record rendered prompt texts into llm_calls.jsonl for reproducibility
  save_prompt_text: true

  # Base directory path for session storage artifacts (relative or absolute)
  runs_dir: "runs"

  # Base directory path for prompt template text files
  prompts_dir: "prompts"

  # Topological sort weight for dependency graph depth and connectivity
  priority_dep_weight: 0.60

  # Topological sort weight for natural section sequence
  priority_section_weight: 0.40
